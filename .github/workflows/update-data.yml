name: Update NFL data

on:
  schedule:
    # Daily at 10:00 UTC (rosters, schedule, projections + any final scores)
    - cron: "0 10 * * *"
    # Extra runs on game days so scores/standings update overnight:
    # Monday & Tuesday 07:00 UTC catch Sun/Mon night finals.
    - cron: "0 7 * * 1,2"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Refresh rosters, schedule, projections
        env:
          FANTASYPROS_API_KEY: ${{ secrets.FANTASYPROS_API_KEY }}
        run: python scripts/update_data.py

      - name: Refresh weekly scores
        run: python scripts/update_scores.py

      - name: Commit updated data
        run: |
          git config user.name "pickem-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "Data update $(date -u +%F)"
          git push
